<title>MyWallet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>

/* Layout: one phone column. Big gradient balance card on top, colorful account cards, floating pill nav with a raised + button. Deep teal-to-green, from the app's green identity. */
:root{
  --bg:#ECF2F2; --surface:#FFFFFF; --surface2:#E3ECEC; --ink:#0E1F21; --ink2:#4A5F61; --mute:#7A8D8F; --line:#DAE4E4;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D5EEE6;
  --in:#12805C; --out:#D1453B; --warn:#B86E00; --warn-soft:#FCEFD6; --out-soft:#FCE4E1;
  --hero:linear-gradient(140deg,#0A3B4A 0%,#0E6B5C 58%,#17A580 100%);
  --navbg:rgba(255,255,255,.88);
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-display:'Manrope',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(14,31,33,.06),0 4px 14px rgba(14,31,33,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071012; --surface:#101C1E; --surface2:#182729; --ink:#E8F2F1; --ink2:#9FB4B4; --mute:#7A9091; --line:#1E3033;
  --accent:#3FD3A5; --accent-ink:#04201A; --accent-soft:#12372F;
  --in:#4FD6A0; --out:#F2796F; --warn:#E8B14F; --warn-soft:#3A2D12; --out-soft:#3B1D1A;
  --navbg:rgba(16,28,30,.88); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071012; --surface:#101C1E; --surface2:#182729; --ink:#E8F2F1; --ink2:#9FB4B4; --mute:#7A9091; --line:#1E3033;
  --accent:#3FD3A5; --accent-ink:#04201A; --accent-soft:#12372F;
  --in:#4FD6A0; --out:#F2796F; --warn:#E8B14F; --warn-soft:#3A2D12; --out-soft:#3B1D1A;
  --navbg:rgba(16,28,30,.88); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:500 14px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:6px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1{font:800 28px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
h2{font:700 18px/1.2 var(--f-display);margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 14px}
.tools{display:flex;gap:8px;align-items:center}
.sub{color:var(--ink2);font-size:13px}
.mute{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow);min-width:0}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.big{font:800 34px/1.05 var(--f-display);letter-spacing:-.02em}
.mid{font:800 20px/1.1 var(--f-display)}
.in{color:var(--in)} .out{color:var(--out)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink2);background:var(--surface);box-shadow:var(--shadow)}
.iconbtn.solid{background:var(--hero);color:#fff}
.iconbtn svg,.nav svg,.btn svg,.gbtn svg,.row>svg{flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn svg,.btn svg,.gbtn svg{width:22px;height:22px}
.nav svg{width:24px;height:24px}
.row>svg{width:20px;height:20px;stroke:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 0;min-width:0}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px;color:#fff;background:var(--hero);box-shadow:0 14px 30px rgba(10,59,74,.28)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:240px;height:240px;right:-80px;top:-100px;background:rgba(255,255,255,.09)}
.hero::after{width:170px;height:170px;left:-60px;bottom:-90px;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .hl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.82}
.hero .amount{font:800 40px/1.1 var(--f-display);letter-spacing:-.02em;margin:10px 0 16px;overflow-wrap:anywhere}
.gbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:11px 13px;min-width:0}
.glass small{display:block;font-size:12px;opacity:.85;font-weight:600}
.glass b{display:block;font:800 16px/1.3 var(--f-display);overflow-wrap:anywhere}
/* floating nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.nav-in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;height:66px;background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:33px;box-shadow:0 10px 30px rgba(10,30,34,.2),0 0 0 1px var(--line)}
.nav-in>button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:11px;font-weight:700;min-width:0}
.nav-in>button[aria-current="page"]{color:var(--accent)}
.nav-fab{width:60px;height:60px;border-radius:50%!important;margin:-30px auto 0;background:var(--hero)!important;color:#fff!important;display:grid!important;place-items:center;box-shadow:0 10px 22px rgba(14,107,92,.45),0 0 0 5px var(--bg);flex-direction:row}
.nav-fab svg{width:28px;height:28px;stroke-width:2.4}
/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:20px;padding:4px;box-shadow:var(--shadow)}
.mnav b{font:700 16px var(--f-display)}
.mnav .iconbtn{box-shadow:none;background:var(--surface2);width:40px;height:40px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum>div{min-width:0}
.sum .v{font:800 16px/1.2 var(--f-display);overflow-wrap:anywhere}
/* chips + seg */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--surface2);border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:12px;font-size:13px;font-weight:700;color:var(--ink2);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.icons{flex:none}.seg.icons button{width:44px;display:grid;place-items:center}
.seg.icons svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* rows */
.dayh{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;padding:14px 6px 8px;font-weight:700}
.list{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:62px}
.row+.row{border-top:1px solid var(--line)}
.ico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);font-size:20px}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rmain b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmain small{color:var(--mute);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font:800 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.add{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--out-soft);color:var(--out)}
.empty{text-align:center;color:var(--ink2);padding:36px 12px}
.empty .ico{margin:0 auto 10px;width:56px;height:56px;font-size:26px;border-radius:18px}
.note{font-size:12px;color:var(--mute);line-height:1.55}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:18px;padding:10px 12px 10px 16px;font-size:13px;font-weight:600}
/* account cards */
.acards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{position:relative;overflow:hidden;border-radius:24px;padding:14px;min-height:140px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:var(--g);box-shadow:0 10px 22px rgba(10,30,40,.18);min-width:0}
.acard::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.12)}
.acard::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-30px;bottom:-60px;background:rgba(255,255,255,.08)}
.acard>*{position:relative;z-index:1}
.acard .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.acard .aic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:19px}
.acard .an{font-weight:800;font-size:15px;overflow-wrap:anywhere;line-height:1.2}
.acard .ak{font-size:12px;opacity:.82;font-weight:600}
.acard .ab{font:800 18px/1.15 var(--f-display);overflow-wrap:anywhere}
.acard .atag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;letter-spacing:.03em}
.acard.ign{filter:saturate(.35);opacity:.75}
.acards.listv{grid-template-columns:1fr}
.acards.listv .acard{min-height:0;flex-direction:row;align-items:center;gap:12px}
.acards.listv .acard .mainc{flex:1;min-width:0}
.acards.listv .acard .ah{display:contents}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--g);box-shadow:0 0 0 2px var(--bg)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
/* bank verdict */
.verdict{position:relative;overflow:hidden;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:6px;background:var(--hero);color:#fff;box-shadow:0 14px 30px rgba(10,59,74,.28)}
.verdict::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-110px;background:rgba(255,255,255,.1)}
.verdict>*{position:relative}
.verdict.add{background:linear-gradient(140deg,#7A4300,#D98A12)}
.verdict.missed{background:linear-gradient(140deg,#7C1526,#D6455A)}
.verdict.locked{background:linear-gradient(140deg,#0B4F6C,#1788A8)}
.verdict .vt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.85}
.verdict .big{font-size:42px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:13px 11px;min-width:0;box-shadow:var(--shadow)}
.stat .v{font:800 15px/1.2 var(--f-display);margin-top:5px;overflow-wrap:break-word}
.stat .lbl{font-size:10px}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);font-weight:700;min-width:0}
input.in-t,select.in-t,textarea.in-t{width:100%;min-height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;font-weight:600;color:var(--ink)}
input.amount{font:800 32px var(--f-display);min-height:64px;text-align:center}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
@media (max-width:360px){.formgrid{grid-template-columns:1fr}}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;text-align:center;min-width:0;overflow-wrap:anywhere}
.cat span{font-size:23px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,14,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:13px;font-weight:600;max-width:88%}
.recHead{border-radius:24px;padding:18px;text-align:center;color:#fff}
.recHead.expense{background:linear-gradient(140deg,#8E2A22,#D1453B)}.recHead.income{background:linear-gradient(140deg,#0B5A44,#1F9A72)}.recHead.transfer{background:linear-gradient(140deg,#24406E,#4A74B5)}.recHead.check{background:linear-gradient(140deg,#3A4A47,#6B7F7A)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--ink2)} .kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere;font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--out)}
.chartwrap{position:relative}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartwrap text{fill:var(--ink2);font:600 11px var(--f-body)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:10px;padding:6px 9px;white-space:nowrap;transform:translateX(-50%);display:none;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.legend i.l{height:0;border-top:2px solid var(--ink);border-radius:0;width:16px;vertical-align:3px}
.legend i.d{height:0;border-top:2px dashed var(--ink2);border-radius:0;width:16px;vertical-align:3px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto;max-height:260px;overflow-y:auto}
summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:6px 0;font-weight:600}

/* ---------- motion (all off when the phone asks for reduced motion) ---------- */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{to{opacity:0}}
  @keyframes sheetIn{from{transform:translateY(110px);opacity:0}to{transform:none;opacity:1}}
  @keyframes sheetOut{to{transform:translateY(70px);opacity:0}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes pop{0%{transform:scale(.55) translateY(5px)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes flash{from{background-color:var(--accent-soft)}to{background-color:transparent}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,20px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(24px,-16px)}}
  .enter>.top,.enter>.stack>*:not(#reclist):not(.acards),.enter>.stack>#reclist>*,.enter>.stack>.acards>*{animation:rise .65s cubic-bezier(.34,1.5,.64,1) both;animation-delay:calc(var(--i,0)*50ms)}
  .enter .bar>i{transform-origin:left;animation:growx 1s cubic-bezier(.34,1.3,.64,1) .2s both}
  .enter .chartwrap path{transform-box:fill-box;transform-origin:bottom;animation:barUp .7s cubic-bezier(.34,1.5,.64,1) both;animation-delay:calc(var(--k,0)*16ms)}
  .enter .chartwrap polyline{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .45s both}
  .enter .chartwrap circle{animation:fade .3s 1.5s both}
  .nav.pop .nav-in>button[aria-current="page"] svg{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
  .fresh .sheet{animation:sheetIn .5s cubic-bezier(.34,1.4,.64,1)}
  .fresh .scrim{animation:fade .25s ease-out}
  .closing .sheet{animation:sheetOut .17s ease-in both}
  .closing .scrim{animation:fadeOut .17s ease-in both}
  .toast{animation:toastIn .42s cubic-bezier(.34,1.6,.64,1)}
  .row.flash{animation:flash 1.8s ease-out}
  .hero::before,.verdict::before{animation:drift 16s ease-in-out infinite alternate}
  .hero::after{animation:drift2 19s ease-in-out infinite alternate}
  .btn,.chip,.iconbtn,.gbtn,.cat,.acard,.row,.seg button,.nav-in>button,.sw{transition:transform .1s ease-out,background-color .2s,box-shadow .2s,color .2s}
  .row:active{background-color:var(--surface2)}
  /* press down, then each kind of control springs back in its own way */
  .dn{transform:scale(.88)}
  .acard.dn{transform:scale(.94)}
  .row.dn{transform:scale(.985)}
  .nav-in>button.dn{transform:none}
  .nav-in>button svg{transition:transform .1s ease-out}
  .nav-in>button.dn svg{transform:translateY(3px) scale(.78)}
  .nav-fab.dn{transform:scale(.82)}
  @keyframes b-squish{0%{transform:scale(.9,.82)}40%{transform:scale(1.09,1.14)}70%{transform:scale(.98,.97)}100%{transform:none}}
  @keyframes b-jelly{0%{transform:scale(.88) rotate(-5deg)}40%{transform:scale(1.14) rotate(4deg)}70%{transform:scale(.97) rotate(-1.5deg)}100%{transform:none}}
  @keyframes b-spin{0%{transform:scale(.78) rotate(-30deg)}40%{transform:scale(1.22) rotate(14deg)}70%{transform:scale(.97) rotate(-4deg)}100%{transform:none}}
  @keyframes b-hop{0%{transform:translateY(4px) scale(.88)}40%{transform:translateY(-10px) scale(1.08)}70%{transform:translateY(2px)}100%{transform:none}}
  @keyframes b-tilt{0%{transform:scale(.93) rotate(-2deg)}40%{transform:scale(1.05) rotate(1.4deg)}70%{transform:scale(.99) rotate(-.4deg)}100%{transform:none}}
  @keyframes b-pop{0%{transform:scale(.82)}40%{transform:scale(1.16)}70%{transform:scale(.97)}100%{transform:none}}
  @keyframes b-nudge{0%{transform:scale(.985)}40%{transform:translateX(9px)}70%{transform:translateX(-2px)}100%{transform:none}}
  @keyframes b-fab{0%{transform:scale(.82) rotate(0)}40%{transform:scale(1.22) rotate(200deg)}70%{transform:scale(.96) rotate(350deg)}100%{transform:rotate(360deg)}}

const N={tab:'rec',month:todayStr().slice(0,7),acct:'all',q:'',search:false,bankId:null,bview:'home',more:null,ayear:false,atype:'expense',chartTable:false,wi:{dir:'out',amount:'',date:''}};

function money(n,o){
  const st=S.settings,dec=st.dec;

  if(n<0&&r>0)s='-'+s; else if(o&&o.sign&&n>0)s='+'+s;
  return s;
}

const GRADS=['linear-gradient(135deg,#0B4F6C,#1B8AA6)','linear-gradient(135deg,#0A5A4B,#22A077)','linear-gradient(135deg,#43389A,#7C62D8)','linear-gradient(135deg,#B23A0A,#E5791A)','linear-gradient(135deg,#9A1B48,#D9467A)','linear-gradient(135deg,#1C2740,#44558A)','linear-gradient(135deg,#6E4A00,#B07F12)','linear-gradient(135deg,#2D5A29,#5E9A44)'];

/* ---------- balances ---------- */
function entriesFor(a){
  const ck='e'+a.id;if(RC[ck])return RC[ck];
  const out=[];RC[ck]=out;
  S.recs.forEach(r=>{
    if(r.type==='transfer'){
      if(r.acct===a.id)out.push({d:r.date,delta:-r.amount,r});
      if(r.to===a.id)out.push({d:r.date,delta:r.toAmount!=null?r.toAmount:r.amount,r});
    }else if(r.acct===a.id){
      if(r.type==='check')out.push({d:r.date,check:true,val:r.amount,r});
      else out.push({d:r.date,delta:r.type==='income'?r.amount:-r.amount,r});
    }
  });
  return out;
}
function series(a,endDn){
  const sk='s'+a.id+':'+endDn;if(RC[sk])return RC[sk];
  const es=entriesFor(a); let start=dn(a.openDate||todayStr());
  es.forEach(e=>{const x=dn(e.d);if(x<start)start=x});
  const by=new Map(); es.forEach(e=>{const k=dn(e.d);if(!by.has(k))by.set(k,[]);by.get(k).push(e)});
  const vals=[]; let bal=Number(a.initial)||0;
  for(let d=start;d<=endDn;d++){
    const list=(by.get(d)||[]).sort((x,y)=>x.r.ts-y.r.ts); let chk=null;
    list.forEach(e=>{if(e.check)chk=e.val;else bal+=e.delta});
    if(chk!=null)bal=chk; vals.push(bal);
  }
  const last=vals.length?vals[vals.length-1]:(Number(a.initial)||0);
  return RC[sk]={start,vals,at:d=>d<start?0:(d-start>=vals.length?last:vals[d-start])};
}
const balanceAt=(a,dnum)=>series(a,dnum).at(dnum);
const balanceNow=a=>balanceAt(a,dn(todayStr()));

/* ---------- bank rule engine ---------- */
function period(cfg,t){
  const d=new Date(t*864e5),y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate();
  if(cfg.period==='cycle'){
    const s=Math.min(28,Math.max(1,parseInt(cfg.startDay)||1)); let sy=y,sm=m;
    if(day<s){sm--;if(sm<0){sm=11;sy--}}
    return {start:Date.UTC(sy,sm,s)/864e5,end:Date.UTC(sy,sm+1,s)/864e5-1};
  }
  return {start:Date.UTC(y,m,1)/864e5,end:Date.UTC(y,m+1,1)/864e5-1};
}
function bankCalc(a,tOv){
  const cfg=a.bank,T=tOv!=null?tOv:dn(todayStr()),p=period(cfg,T),N_=p.end-p.start+1;
  const ser=series(a,T),cur=ser.at(T),min=Number(cfg.min)||0;
  let pts=0,breachDay=null;
  for(let d=p.start;d<T;d++){const b=ser.at(d);pts+=Math.max(0,b);if(breachDay==null&&d>=ser.start&&b<min)breachDay=d}
  const R=p.end-T+1,elapsed=T-p.start+1,avgNow=(pts+Math.max(0,cur))/elapsed;
  let L=min,locked=false;
  if(cfg.rule==='avg'){L=Math.max(0,Math.ceil((min*N_-pts)/R-1e-9));locked=pts>=min*N_}
  const safe=cur-L; let verdict='ok';
  if(cfg.rule==='avg'){verdict=locked?'locked':(safe>=0?'ok':'add')}
  else if(cfg.rule==='daily'){verdict=breachDay!=null?'missed':(safe>=0?'ok':'add')}
  else verdict=safe>=0?'ok':'add';
  return {cfg,p,N:N_,T,R,elapsed,ser,cur,pts,breachDay,avgNow,L,locked,safe,verdict,need:Math.max(0,-safe),min};
}
function whatIf(a,signed,dateDn){
  const c=bankCalc(a),min=c.min,bals=[];
  for(let d=c.T;d<=c.p.end;d++)bals.push(c.cur+(d>=dateDn?signed:0));
  let measure,label,ok;
  if(c.cfg.rule==='avg'){measure=(c.pts+sum(bals.map(b=>Math.max(0,b))))/c.N;label='Average at period end';ok=measure>=min}
  else if(c.cfg.rule==='daily'){measure=Math.min(...bals);label='Lowest day from now';ok=c.breachDay==null&&measure>=min}
  else {measure=bals[bals.length-1];label='Balance on last day';ok=measure>=min}
  return {c,measure,label,ok,newNow:bals[0],gap:measure-min};
}
const RULES={avg:'Average daily balance',daily:'Daily minimum',end:'Month-end minimum'};
const ruleHelp={avg:'Each day’s end-of-day balance is added up and divided by the days in the period. The average has to reach the minimum.',
  daily:'The balance must be at or above the minimum on every day of the period.',

function openSheet(s){const was=!!SH;SH=s;if(!was)sheetFresh=true;renderSheet()}

function stagger(){let i=0;const give=el=>el.style.setProperty('--i',Math.min(i++,14));
  [...$('#app').children].forEach(el=>{if(el.classList.contains('stack'))[...el.children].forEach(c=>{if(c.id==='reclist'||c.classList.contains('acards'))[...c.children].forEach(give);else give(c)});else give(el)})}
function countUps(enter){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,k=el.dataset.ck,prev=LAST[k];LAST[k]=to;
    if(reduceMotion()||S.settings.hide)return;
    const from=enter?0:(prev==null?0:prev);if(from===to)return;
    const t0=performance.now(),dur=520;el.textContent=money(from);
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=money(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

function vAcc(){
  const bals=S.accounts.map(a=>balanceNow(a)*(a.rate||1));
  const tot=sum(bals),assets=sum(bals.filter(v=>v>0)),liab=-sum(bals.filter(v=>v<0));
  const lv=S.settings.aview==='list';

function ruleLine(c){

function bHome(a){

  else if(c.verdict==='locked'){vt='Locked in';main=money(mv=Math.max(0,c.cur));line=`is all yours. The average already reaches ${money(c.min)} for this period.`}

  const daysLeft=c.R-1;

  <div class="stats"><div class="stat"><div class="lbl">Balance now</div><div class="v num">${money(c.cur)}</div></div>
   <div class="stat"><div class="lbl">${cfg.rule==='avg'?'Average so far':'Minimum'}</div><div class="v num">${cfg.rule==='avg'?money(c.avgNow):money(c.min)}</div></div>
   <div class="stat"><div class="lbl">${esc(ruleLine(c))}</div><div class="v num">${money(c.L)}</div></div></div>
  <div class="card stack" style="gap:8px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(fdate(fromDn(c.p.start)))} to ${esc(fdate(fromDn(c.p.end)))}</b>${interest}</div>
   <div class="bar ${c.verdict==='add'||c.verdict==='missed'?'warn':''}" role="img" aria-label="Day ${c.elapsed} of ${c.N}"><i style="width:${Math.round(c.elapsed/c.N*100)}%"></i></div>
   <div class="sub">Day ${c.elapsed} of ${c.N} · ${daysLeft} day${daysLeft===1?'':'s'} left · charge if below: ${money(fee)}</div></div>
  <div class="row2"><button class="btn" data-a="addRec" data-type="income" data-acct="${a.id}">Money in</button><button class="btn ghost" data-a="addRec" data-type="expense" data-acct="${a.id}">Money out</button><button class="btn ghost" data-a="addRec" data-type="check" data-acct="${a.id}">Check balance</button></div>
  ${cfg.otherFees.length?`<div class="card"><div class="lbl">Other fees (reference)</div>${cfg.otherFees.map(f=>`<div class="kv"><span>${esc(f.n)}</span><span class="num">${money(f.a)}</span></div>`).join('')}</div>`:''}`;
}

/* chart */
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const compact=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+'M':v>=1e3?(+(v/1e3).toFixed(1))+'k':String(Math.round(v));
let chartData=null;
function bChart(a){
  const c=bankCalc(a),days=[];let run=0;
  for(let d=c.p.start;d<=c.p.end;d++){
    if(d<=c.T){const b=c.ser.at(d);run+=Math.max(0,b);days.push({d,b,avg:run/(d-c.p.start+1)})}else days.push({d,b:null,avg:null});
  }
  chartData={days,c};
  const W=360,H=230,m={l:40,r:10,t:16,b:26},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const vmax=niceMax(Math.max(c.min,...days.filter(x=>x.b!=null).map(x=>x.b),1)*1.08);
  const y=v=>m.t+ph-(Math.max(0,v)/vmax)*ph, bw=pw/days.length, cx=i=>m.l+bw*i+bw/2;
  const ticks=[0,.25,.5,.75,1].map(f=>f*vmax);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily balance bars with the minimum and running average lines">`;
  ticks.forEach(t=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end">${compact(t)}</text>`});
  days.forEach((x,i)=>{
    if(x.b==null)return;const h=Math.max(0,ph-(y(x.b)-m.t));if(h<=0)return;
    const below=x.b<c.min,w=Math.max(2,bw*.64),bx=cx(i)-w/2,by=y(x.b),r=Math.min(3,w/2,h);
    s+=`<path d="M${bx} ${m.t+ph}V${by+r}Q${bx} ${by} ${bx+r} ${by}H${bx+w-r}Q${bx+w} ${by} ${bx+w} ${by+r}V${m.t+ph}Z" fill="${below?'var(--warn)':'var(--accent)'}" opacity=".9" style="--k:${i}"/>`});
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(c.min)}" y2="${y(c.min)}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const pts=days.map((x,i)=>x.avg==null?null:`${cx(i).toFixed(1)},${y(x.avg).toFixed(1)}`).filter(Boolean);
  if(a.bank.rule==='avg'&&pts.length){
    s+=`<polyline pathLength="1" points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const ti=c.T-c.p.start,last=days[ti];s+=`<circle cx="${cx(ti)}" cy="${y(last.avg)}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const lab=[0,Math.floor((days.length-1)/2),days.length-1];
  lab.forEach((i,k)=>{s+=`<text x="${cx(i)}" y="${H-8}" text-anchor="${k===0?'start':k===2?'end':'middle'}">${esc(fdate(fromDn(days[i].d)))}</text>`});
  s+=`<line id="cur" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" stroke="var(--ink)" stroke-width="1" opacity="0"/></svg>`;
  const rows=days.filter(x=>x.b!=null).map(x=>`<tr><td>${esc(fdate(fromDn(x.d)))}</td><td class="num">${money(x.b)}</td><td class="num">${money(x.avg)}</td></tr>`).join('');
  return `<div class="card stack" style="gap:10px"><div class="lbl">Daily balance · ${esc(fdate(fromDn(c.p.start)))} to ${esc(fdate(fromDn(c.p.end)))}</div>
  <div class="chartwrap" id="chartwrap" data-m="${m.l}" data-w="${W}" data-n="${days.length}">${s}<div class="tip" id="tip"></div></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Day balance</span><span><i style="background:var(--warn)"></i>Below minimum</span><span><i class="d"></i>Minimum ${money(c.min)}</span>${a.bank.rule==='avg'?'<span><i class="l"></i>Running average</span>':''}</div>
  <details><summary>Show as table</summary><div class="scroll"><table><thead><tr><th>Day</th><th>Balance</th><th>Average</th></tr></thead><tbody>${rows}</tbody></table></div></details></div>`;
}
function bindChart(){
  const w=$('#chartwrap');if(!w||!chartData)return;
  const move=e=>{
    const r=w.getBoundingClientRect(),W=+w.dataset.w,ml=+w.dataset.m,n=+w.dataset.n,k=r.width/W;
    const px=(e.clientX-r.left)/k,bw=(W-ml-10)/n,i=Math.floor((px-ml)/bw);
    if(i<0||i>=n){return}
    const x=chartData.days[i],tip=$('#tip'),cur=$('#cur');
    if(x.b==null){tip.style.display='none';return}
    tip.innerHTML=`${esc(fdate(fromDn(x.d)))}: <b>${money(x.b)}</b>${chartData.c.cfg.rule==='avg'?` · avg ${money(x.avg)}`:''}`;
    tip.style.display='block';
    const left=Math.min(Math.max((ml+bw*i+bw/2)*k,60),r.width-60);tip.style.left=left+'px';
    cur.setAttribute('x1',ml+bw*i+bw/2);cur.setAttribute('x2',ml+bw*i+bw/2);cur.setAttribute('opacity','.5');
  };
  w.addEventListener('pointermove',move);w.addEventListener('pointerdown',move);
  w.addEventListener('pointerleave',()=>{const t=$('#tip');if(t)t.style.display='none';const c=$('#cur');if(c)c.setAttribute('opacity','0')});
}

function bWhatIf(a){
  const wi=N.wi,c=bankCalc(a);if(!wi.date)wi.date=todayStr();

function wiResult(a){

  <div class="big num">${money(r.measure)}</div><div class="sub">${r.ok?`${money(Math.abs(r.gap))} above the ${money(r.c.min)} minimum.`:`${money(Math.abs(r.gap))} under the ${money(r.c.min)} minimum. A ${money(fee)} charge may apply.`}</div>
  <div class="kv"><span>Balance on ${esc(fdate(fromDn(dd)))}</span><span class="num">${money(r.c.cur+(wi.dir==='out'?-amt:amt))}</span></div>
  ${!r.ok&&a.bank.rule!=='daily'?`<div class="kv"><span>Deposit to fix it</span><span class="num">${money(a.bank.rule==='avg'?Math.ceil(Math.abs(r.gap)*r.c.N/(r.c.p.end-dd+1)):Math.abs(r.gap))}</span></div>`:''}</div>`;
}

function bEntries(a){

  const row=r=>{const incoming=r.type==='income'||(r.type==='transfer'&&r.to===a.id);const v=r.type==='check'?r.amount:(incoming?(r.type==='transfer'&&r.toAmount!=null?r.toAmount:r.amount):-r.amount);

  return `<div class="row2"><button class="btn" data-a="addRec" data-type="income" data-acct="${a.id}">Money in</button><button class="btn ghost" data-a="addRec" data-type="expense" data-acct="${a.id}">Money out</button><button class="btn ghost" data-a="addRec" data-type="check" data-acct="${a.id}">Check</button></div>

}

/* --- budgets --- */
function spentIn(m,catId){const mr=monthRange(m);return sum(S.recs.filter(r=>r.type==='expense'&&r.cat===catId&&dn(r.date)>=mr.s&&dn(r.date)<=mr.e).map(r=>r.amount*((acc(r.acct)||{}).rate||1)))}
function vBud(){

    return `<button class="card stack" style="gap:8px;text-align:left;width:100%" data-a="budEdit" data-id="${id}"><div style="display:flex;align-items:center;gap:10px"><span class="ico">${esc(c.icon)}</span><b style="flex:1;font-weight:500">${esc(c.name)}</b><span class="sub num">${money(sp)} / ${money(lim)}</span></div>
    <div class="bar ${pct>1?'over':pct>=.8?'warn':''}" role="img" aria-label="${Math.round(pct*100)} percent used"><i style="width:${Math.min(100,pct*100)}%"></i></div><div class="sub ${left<0?'out':''}">${left>=0?money(left)+' left':'Over by '+money(-left)}</div></button>`}).join('');

const backHead=t=>`<div class="top"><div style="display:flex;align-items:center;gap:8px"><button class="iconbtn" data-a="back" aria-label="Back">${ic('left')}</button><h1>${t}</h1></div></div>`;

  const sec=t=>`<div class="lbl" style="margin:6px 4px">${t==='expense'?'Expense categories':'Income categories'}</div><div class="list">${S.cats.filter(c=>c.type===t).map(c=>`<button class="row" data-a="catEdit" data-id="${c.id}"><span class="ico">${esc(c.icon)}</span><span class="rmain"><b>${esc(c.name)}${c.ignored?' (ignored)':''}</b></span>${ic('edit')}</button>`).join('')}</div>`;

const SHEETS={},MORE={},CHG={};
function renderSheet(){RC={};
  const el=$('#sheet');if(!SH){el.className='';el.innerHTML='';return}
  const k=SH.kind;let h='';
  if(k==='confirm')h=wrap('Are you sure?',`<p style="margin:0">${esc(SH.msg)}</p><div class="row2"><button class="btn ghost" data-a="closeSheet">Cancel</button><button class="btn danger" data-a="confirmYes">${esc(SH.yes)}</button></div>`,'small');
  else if(k==='reset')h=wrap('Delete data',`<button class="btn ghost block" data-a="resetRecs">Delete all records, keep accounts and categories</button><button class="btn danger block" data-a="resetAll">Delete everything</button>`,'small');
  else if(SHEETS[k])h=SHEETS[k]();
  else if(k==='rec')h=recSheet();
  else if(k==='recView')h=recView();
  else if(k==='acct')h=acctView();
  else if(k==='acctEdit')h=acctEdit();
  else if(k==='bud')h=budSheet();
  else if(k==='catEdit')h=catSheet();
  el.className=sheetFresh?'fresh':'';sheetFresh=false;el.innerHTML=h;
}
function acctView(){

  return wrap(a.name,`<div class="card"><div class="lbl">Balance</div><div class="big num">${money(balanceNow(a))}</div><div class="sub">${n} record${n===1?'':'s'}</div></div>

  $('#app').innerHTML=main;

  else nav.querySelectorAll('button[data-k]').forEach(b=>{if(b.dataset.k===curTab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});

/* ---------- events ---------- */
const BOING=[['.ibtn','pop'],['.nav-fab','fab'],['.nav-in>button','nav'],['.btn','squish'],['.chip','jelly'],['.iconbtn,.gbtn','spin'],['.cat','hop'],['.acard','tilt'],['.seg button','pop'],['.sw','pop'],['.row','nudge']];
const boingStyle=el=>{for(const [sel,st] of BOING)if(el.matches(sel))return st;return null};
document.addEventListener('pointerdown',e=>{
  if(reduceMotion())return;const t=e.target.closest('[data-a]');if(!t||t.disabled||!boingStyle(t))return;
  t.classList.add('dn');if(window.haptic)haptic(8);const off=()=>t.classList.remove('dn');
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>t.addEventListener(ev,off,{once:true}));
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(!f)return;
  const st=reduceMotion()?null:boingStyle(t);
  if(!st){f(t.dataset,e);return}
  if(t._busy)return;t._busy=true;
  const d=t.dataset;t.classList.remove('dn');t.classList.add('b-'+st);
  setTimeout(()=>f(d,e),st==='fab'?150:120);
  setTimeout(()=>{t.classList.remove('b-'+st);t._busy=false},520);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.d&&SH&&SH.d){SH.d[t.dataset.d]=t.value;return}
  if(t.dataset.aInput==='q'){N.q=t.value;const l=$('#reclist');if(l){const keep=N.search;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}return}
  if(t.dataset.aInput==='wiAmt'){N.wi.amount=t.value;$('#wiOut').innerHTML=wiResult(acc(N.bankId))}
  if(t.dataset.aInput==='wiDate'){N.wi.date=t.value;$('#wiOut').innerHTML=wiResult(acc(N.bankId))}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.d&&SH&&SH.d){SH.d[t.dataset.d]=t.value;if(SH.kind==='rec'&&(t.dataset.d==='acct'))ensureTo(SH.d);return}
  const c=t.dataset.c;if(!c)return;
  if(CHG[c]){CHG[c](t);return}
  if(c==='bank'){const k=t.dataset.k,b=acc(N.bankId).bank;if(k==='bankName')b[k]=t.value;else{const v=num(t.value);b[k]=isNaN(v)?0:(k==='startDay'?Math.min(28,Math.max(1,Math.round(v))):Math.max(0,v))}save();render()}
  else if(c==='acctname'){const v=t.value.trim();if(v){acc(N.bankId).name=v;save();render()}}
  else if(c==='cur'){S.settings.cur=t.value;save();render()}
  else if(c==='curcustom'){const v=t.value.trim();if(v){S.settings.cur=v;save();render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});

/* ---------- streaks, payday, allowance, safe to spend ---------- */
const TD=()=>dn(todayStr());
function loggedDays(){const T=TD();return new Set(S.recs.filter(r=>r.type!=='check'&&dn(r.date)<=T).map(r=>dn(r.date)))}
function streak(){const ds=loggedDays();let d=TD();if(!ds.has(d))d--;let c=0;while(ds.has(d)){c++;d--}return c}
function longestStreak(){const a=[...loggedDays()].sort((x,y)=>x-y);let best=0,cur=0,prev=-1e9;for(const d of a){cur=d===prev+1?cur+1:1;best=Math.max(best,cur);prev=d}return best}
function paydayOf(y,m,day){const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Date.UTC(y,m,Math.min(day,dim))/864e5}
function payCfg(){const p=S.settings.pay;if(p&&p.mode)return p;const d=S.settings.payday|0;return d>0?{mode:'m1',d1:d,d2:20,wd:5}:{mode:'off',d1:1,d2:15,wd:5}}
function payDates(T){const p=payCfg();if(p.mode==='off')return null;
  if(p.mode==='w'){const dow=new Date(T*864e5).getUTCDay(),prev=T-((dow-p.wd+7)%7);return {prev,next:prev+7}}
  const days=p.mode==='m2'?[p.d1,p.d2]:[p.d1],dt=new Date(T*864e5),y=dt.getUTCFullYear(),m=dt.getUTCMonth(),c=[];
  for(let k=-1;k<=1;k++)days.forEach(d=>c.push(paydayOf(y,m+k,d)));
  return {prev:Math.max(...c.filter(x=>x<=T)),next:Math.min(...c.filter(x=>x>T))}}
function nextPayday(){const r=payDates(TD());return r?r.next:null}
function prevPayday(){const r=payDates(TD());return r?r.prev:null}
const spendAccts=()=>S.accounts.filter(a=>a.kind!=='bank'&&!a.ignored&&!S.goals.some(g=>g.acct===a.id));
function allowanceInfo(){
  const pd=nextPayday();if(pd==null)return null;const T=TD(),days=Math.max(1,pd-T);
  const ids=spendAccts().map(a=>a.id);
  const pool=Math.max(0,sum(spendAccts().map(balBase)))*(1-Math.min(90,S.settings.holdPct||0)/100);
  const spent=sum(S.recs.filter(r=>r.type==='expense'&&r.date===todayStr()&&ids.includes(r.acct)).map(r=>r.amount*rate(r.acct)));
  const per=(pool+spent)/days;const pp=prevPayday(),span=Math.max(1,pd-pp);
  return {pd,days,pool,per,spent,left:per-spent,progress:Math.min(1,Math.max(0,(T-pp)/span))};
}
function safeToday(){
  const c=[];const al=allowanceInfo();if(al)c.push([Math.max(0,al.left),'your daily allowance']);
  const ym=todayStr().slice(0,7),b=S.budgets[ym]||{},ids=Object.keys(b).filter(k=>cat(k));
  if(ids.length){const left=sum(ids.map(k=>b[k]))-sum(ids.map(k=>spentIn(ym,k)));const dim=new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5),0)).getUTCDate();c.push([Math.max(0,left/(dim-(+todayStr().slice(8))+1)),'your budgets']);}
  c.push([Math.max(0,sum(spendAccts().map(balBase))),'cash on hand']);
  c.sort((x,y)=>x[0]-y[0]);return {amount:c[0][0],reason:c[0][1]};
}

/* ---------- bills ---------- */
function billDue(b,Tdn){const dt=new Date(Tdn*864e5);let y=dt.getUTCFullYear(),m=dt.getUTCMonth();
  for(let i=0;i<24;i++){const key=y+'-'+pad(m+1);if(!(b.paid||[]).includes(key))return {dn:paydayOf(y,m,b.day),key};m++;if(m>11){m=0;y++}}
  return {dn:Tdn,key:''}}
function dueText(d){const k=d-TD();return k<0?`${-k} day${k===-1?'':'s'} overdue`:k===0?'Due today':k===1?'Due tomorrow':`In ${k} days`}

/* ---------- reminders (shown on Home and sent to Android notifications) ---------- */
function linesFor(dd,first){
  const out=[];
  S.bills.forEach(b=>{const due=billDue(b,TD()).dn;const amt=money(b.amount);
    if(first&&due<dd)out.push(`${b.name} (${amt}) is overdue.`);else if(due===dd)out.push(`${b.name} (${amt}) is due today.`);else if(due===dd+1)out.push(`${b.name} (${amt}) is due tomorrow.`)});
  if(first&&S.settings.alerts!==false){const ym=todayStr().slice(0,7),B=S.budgets[ym]||{};Object.keys(B).filter(k=>cat(k)&&B[k]>0).forEach(k=>{const p=spentIn(ym,k)/B[k];if(p>=1)out.push(`Over your ${catName(k)} budget this month.`);else if(p>=.8)out.push(`${Math.round(p*100)}% of your ${catName(k)} budget is used.`)})}
  S.accounts.filter(a=>a.kind==='bank'&&!a.ignored&&a.bank).forEach(a=>{const c=bankCalc(a,dd);
    if(c.R<=3&&(c.verdict==='add'||c.verdict==='missed'))out.push(c.verdict==='add'?`${a.name}: add ${money(c.need)} before ${fdate(fromDn(c.p.end))} to avoid the ${money(a.bank.fee)} charge.`:`${a.name}: a ${money(a.bank.fee)} charge may apply this period.`)});
  S.debts.filter(x=>!x.paid&&x.due).forEach(x=>{const v=dn(x.due),who=x.theyOweMe?`${x.who} owes you ${money(x.amount)}`:`You owe ${x.who} ${money(x.amount)}`;
    if(first&&v<dd)out.push(`${who}, and it is overdue.`);else if(v===dd)out.push(`${who}. Due today.`);else if(v===dd+1)out.push(`${who}. Due tomorrow.`)});
  const pr=payDates(dd);if(pr&&pr.next===dd+1)out.push('Payday is tomorrow.')
  return out;
}
function pushNative(){
  if(!AND)return;
  try{
    if(AND.setSecure)AND.setSecure(!!(S.settings.lock&&S.settings.passHash));
    const sf=safeToday(),tot=sum(S.accounts.map(balBase));
    if(AND.setWidget)AND.setWidget(JSON.stringify({total:money(tot),safe:money(sf.amount),hide:!!S.settings.hide}));
    if(AND.setReminders){
      const T=TD(),sched=[];for(let i=0;i<14;i++){const l=linesFor(T+i,i===0);sched.push({d:fromDn(T+i),t:l.length?l.slice(0,3).join(' '):'Take a minute to log today’s spending.'})}
      AND.setReminders(!!S.settings.remind,S.settings.remindHour|0,JSON.stringify(sched));
    }
  }catch(e){console.error(e)}
}

const goalAcct=g=>g.acct?acc(g.acct):null;
const goalSaved=g=>{const a=goalAcct(g);return a?Math.max(0,balBase(a)):sum((g.contribs||[]).map(c=>c.amount))};
function earnedBadges(){
  const e=new Set(),n=S.recs.filter(r=>r.type!=='check').length,ls=longestStreak();
  if(n>=1)e.add('first');if(n>=25)e.add('rec25');if(n>=100)e.add('rec100');
  if(ls>=3)e.add('streak3');if(ls>=7)e.add('streak7');if(ls>=30)e.add('streak30');
  if(n>=1&&sum(S.accounts.map(balBase))>=1000)e.add('save1k');
  if(S.goals.some(g=>g.target>0&&goalSaved(g)>=g.target))e.add('goal');
  const d=new Date(TD()*864e5),pm=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1)),key=pm.getUTCFullYear()+'-'+pad(pm.getUTCMonth()+1);
  const pb=S.budgets[key]||{},ids=Object.keys(pb).filter(k=>cat(k));if(ids.length&&ids.every(k=>spentIn(key,k)<=pb[k]))e.add('budget');
  if(S.debts.some(x=>x.paid))e.add('debt');if(payCfg().mode!=='off')e.add('planner');
  if(S.accounts.some(a=>a.kind==='bank'&&!a.ignored&&a.bank&&['ok','locked'].includes(bankCalc(a).verdict)))e.add('bank');
  return e;
}

}

/* ---------- confetti ---------- */
function confetti(){
  if(reduceMotion())return;const old=$('#confetti');if(old)old.remove();
  const cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1,W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,ctx=cv.getContext('2d');
  const cols=['#F5C242','#EA6A96','#3AA0E8','#17A580','#9A7BEF','#F0942F'];
  const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.62,vx:(Math.random()-.5)*16*dpr,vy:-(8+Math.random()*16)*dpr,s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[(Math.random()*cols.length)|0],round:Math.random()<.3}));
  const t0=performance.now();
  (function f(t){const k=t-t0;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.55*dpr;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-k/2600);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()});
    if(k<2700)requestAnimationFrame(f);else cv.remove()})(t0);
}

function moodNow(){
  const sf=safeToday(),al=allowanceInfo();
  const bad=S.accounts.find(a=>a.kind==='bank'&&!a.ignored&&a.bank&&['add','missed'].includes(bankCalc(a).verdict));
  const goalDone=S.goals.some(g=>g.target>0&&goalSaved(g)>=g.target);
  let mood='happy',msg;
  if(bad){mood='worried';msg=`${bad.name} needs a top-up. Check the Bank tab.`}
  else if(al&&al.left<0){mood='worried';msg=`You're ${money(-al.left)} over today's allowance.`}
  else if(sf.amount<=0){mood='worried';msg='Nothing is safe to spend right now.'}
  else{
    if(goalDone||streak()>=7){mood='party'}
    msg=`You can spend up to ${money(sf.amount)} today, based on ${sf.reason}.`;
  }
  if(S.settings.hide)msg=mood==='worried'?msg.replace(/[₱$€£¥₹₩฿][\d,.]+/g,'a bit'):'Balances are hidden. Tap the eye to show them.';
  return {mood,msg,sf,al};
}

/* ---------- swipe to delete (with undo) ---------- */
let SW=null,swiped=0;
document.addEventListener('pointerdown',e=>{const row=e.target.closest('.swipe>.row');if(!row)return;SW={row,x:e.clientX,y:e.clientY,dx:0,on:false,id:row.dataset.swipe}},true);
document.addEventListener('pointermove',e=>{if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4)SW.on=true;else if(Math.abs(dy)>12){SW=null;return}else return}
  SW.dx=Math.min(0,dx);SW.row.parentNode.classList.add('on');SW.row.style.transition='none';SW.row.style.transform=`translateX(${SW.dx}px)`});
function endSwipe(){if(!SW)return;const s=SW;SW=null;if(!s.on)return;swiped=Date.now();
  const w=s.row.offsetWidth;s.row.style.transition='transform .28s cubic-bezier(.34,1.4,.64,1)';
  if(s.dx<-Math.min(120,w*.35)){s.row.style.transition='transform .2s ease-in';s.row.style.transform=`translateX(${-w}px)`;setTimeout(()=>deleteWithUndo(s.id),170)}
  else{s.row.style.transform='translateX(0)';setTimeout(()=>s.row.parentNode.classList.remove('on'),300)}}
document.addEventListener('pointerup',endSwipe,true);document.addEventListener('pointercancel',endSwipe,true);
document.addEventListener('click',e=>{if(Date.now()-swiped<350){e.stopImmediatePropagation();e.preventDefault()}},true);
function deleteWithUndo(id){
  const i=S.recs.findIndex(r=>r.id===id);if(i<0)return;const r=S.recs[i];S.recs.splice(i,1);save();render();
  toast('Record deleted',()=>{S.recs.splice(Math.min(i,S.recs.length),0,r);save();render()});
}

const KEYWORDS={Transport:['grab','jeep','tricycle','trike','bus','mrt','lrt','fare','angkas','taxi','gas','fuel','joyride','van'],
 Food:['jollibee','mcdo','mcdonald','kfc','lunch','dinner','breakfast','snack','milk tea','milktea','coffee','food','rice','ulam','canteen','chowking','mang inasal','starbucks','pizza','burger','bread'],
 'Phone & data':['load','data','promo','wifi','phone','sim','gomo','giga'],'Load & data':['load','data','promo','wifi'],Bills:['boarding','rent','water bill','electric','kuryente','internet','bill'],
 School:['notebook','pen','book','print','xerox','school','project','uniform','tuition','exam','ballpen'],Shopping:['shopee','lazada','clothes','shirt','shoes','mall','bag'],
 Health:['medicine','clinic','vitamins','doctor','pharmacy','mercury'],Fun:['netflix','spotify','game','movie','cinema','robux','valorant','mlbb','diamonds','concert']};
const INKEYWORDS={Allowance:['allowance','baon','pocket money','deposit'],Salary:['salary','sweldo','wage','part time','freelance'],Gift:['gift','regalo','aguinaldo','lola','lolo','birthday'],'Bank interest':['interest']};
function guessCat(note,type){
  const n=note.trim().toLowerCase();if(n.length<2)return null;
  const ok=S.cats.filter(c=>c.type===type&&!c.ignored).map(c=>c.id);
  const cnt={};S.recs.forEach(r=>{if((r.note||'').trim().toLowerCase()===n&&ok.includes(r.cat))cnt[r.cat]=(cnt[r.cat]||0)+1});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(best)return best[0];
  const lw=learnCat(n,type,ok);if(lw)return lw;
  const table=type==='expense'?KEYWORDS:INKEYWORDS;
  for(const [name,words] of Object.entries(table)){if(words.some(w=>n.includes(w))){const c=S.cats.find(x=>x.name===name&&x.type===type&&!x.ignored);if(c)return c.id}}
  return null;
}

const Rt=r=>r.amount*rate(r.acct);
const prevMonth=m=>{const [y,mm]=m.split('-').map(Number);const d=new Date(Date.UTC(y,mm-2,1));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)};
const monthsBack=(n)=>{const out=[];let m=todayStr().slice(0,7);for(let i=0;i<n;i++){out.unshift(m);m=prevMonth(m)}return out};
const inMonth=(r,m)=>{const mr=monthRange(m),d=dn(r.date);return d>=mr.s&&d<=mr.e};
const monthSum=(m,type)=>sum(S.recs.filter(r=>r.type===type&&inMonth(r,m)).map(Rt));
const shortMon=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5)-1,1)).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'});

/* ---------- insights ---------- */
function insights(){
  if(S.settings.hide)return [];
  const out=[],ym=todayStr().slice(0,7),pm=prevMonth(ym),day=+todayStr().slice(8);
  const exps=S.recs.filter(r=>r.type==='expense');if(exps.length<3)return out;
  const thisTo=sum(exps.filter(r=>inMonth(r,ym)).map(Rt));
  const lastTo=sum(exps.filter(r=>inMonth(r,pm)&&+r.date.slice(8)<=day).map(Rt));
  if(lastTo>0){const p=Math.round((thisTo-lastTo)/lastTo*100);out.push(p>=0?`You have spent ${p}% more than this time last month.`:`Nice: you have spent ${-p}% less than this time last month.`)}
  const by={};exps.filter(r=>inMonth(r,ym)).forEach(r=>{by[r.cat]=(by[r.cat]||0)+Rt(r)});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]>0)out.push(`${catName(top[0])} is your biggest spending this month (${money(top[1])}).`);
  if(exps.length>=10){const wd=[0,0,0,0,0,0,0];exps.forEach(r=>{wd[new Date(dn(r.date)*864e5).getUTCDay()]+=Rt(r)});const i=wd.indexOf(Math.max(...wd));out.push(`You tend to spend the most on ${['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][i]}.`)}
  const spentDays=new Set(exps.filter(r=>inMonth(r,ym)).map(r=>r.date)).size;const nos=day-spentDays;if(nos>0)out.push(`${nos} no-spend day${nos===1?'':'s'} so far this month.`);
  return out;
}

const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvOf(rs){
  const h=['Date','Type','Account','To account','Category','Amount','Currency','Note'];
  const rows=[...rs].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).map(r=>{const a=acc(r.acct);return [r.date,r.type,a?a.name:'',(acc(r.to)||{}).name||'',(cat(r.cat)||{}).name||'',r.amount,(a&&a.cur)||S.settings.cur,r.note||''].map(csvCell).join(',')});
  return '﻿'+[h.join(','),...rows].join('\r\n');
}

/* ---------- Monthly recap ---------- */
function vRecap(){
  const m=N.month,pm=prevMonth(m),rs=S.recs.filter(r=>r.type==='expense'&&inMonth(r,m));
  const ex=sum(rs.map(Rt)),inc=monthSum(m,'income'),pex=monthSum(pm,'expense');
  const by={};rs.forEach(r=>{by[r.cat]=(by[r.cat]||0)+Rt(r)});const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const big=[...rs].sort((a,b)=>Rt(b)-Rt(a))[0];
  const mr=monthRange(m),T=TD(),last=Math.min(mr.e,T),days=Math.max(0,last-mr.s+1),spentDays=new Set(rs.map(r=>r.date)).size;
  const diff=pex>0?Math.round((ex-pex)/pex*100):null;
  const card=(c,h,big,sub)=>`<div class="rc rc${c}"><small>${h}</small><div class="rbig num">${big}</div><div class="rsub">${sub}</div></div>`;
  const cards=[

    card(1,'Money in',hid(inc),inc>=ex?`You saved ${hid(inc-ex)}. Nice!`:`That is ${hid(ex-inc)} less than you spent.`),
    top?card(2,'Top category',`${esc((cat(top[0])||{icon:'•'}).icon)} ${esc(catName(top[0]))}`,`${hid(top[1])} (${Math.round(top[1]/ex*100)}% of spending)`):card(2,'Top category','—','No expenses yet'),

/* ---------- Debts & split bill ---------- */
function vDebts(){
  const open=S.debts.filter(d=>!d.paid),done=S.debts.filter(d=>d.paid);
  const owedMe=sum(open.filter(d=>d.theyOweMe).map(d=>d.amount)),iOwe=sum(open.filter(d=>!d.theyOweMe).map(d=>d.amount));
  const row=d=>`<button class="row" data-a="debtView" data-id="${d.id}"><span class="ico">${d.theyOweMe?'👉':'👈'}</span><span class="rmain"><b>${esc(d.who)}</b><small>${d.theyOweMe?'Owes you':'You owe'} · ${debtWhen(d)}${d.note?' · '+esc(d.note):''}</small></span><span class="amt ${d.theyOweMe?'in':'out'}">${hid(d.amount)}</span></button>`;
  return backHead('Debts & split bill')+`<div class="stack"><div class="pills2"><div class="card"><div class="lbl">Owed to you</div><div class="mid num in">${hid(owedMe)}</div></div><div class="card"><div class="lbl">You owe</div><div class="mid num out">${hid(iOwe)}</div></div></div>
  <div class="row2"><button class="btn" data-a="debtAdd">${ic('plus')} New debt</button><button class="btn ghost" data-a="splitOpen">➗ Split a bill</button></div>
  ${open.length?`<div class="list">${open.map(row).join('')}</div>`:`<div class="empty card"><div class="ico">🤝</div>No open debts.</div>`}
  ${done.length?`<div class="lbl sec">Settled</div><div class="list dim">${done.slice(-5).reverse().map(row).join('')}</div>`:''}</div>`;
}
MORE.debts=vDebts;
SHEETS.debtEdit=()=>{const d=SH.d;return wrap('New debt',`<div class="seg"><button aria-pressed="${d.theyOweMe}" data-a="debtDir" data-k="1">They owe me</button><button aria-pressed="${!d.theyOweMe}" data-a="debtDir" data-k="0">I owe them</button></div>
  <div class="formgrid"><label class="f full">Who?<input class="in-t" value="${esc(d.who)}" data-d="who" maxlength="30" placeholder="Name"></label><label class="f">Amount<input class="in-t num" inputmode="decimal" value="${esc(d.amount)}" data-d="amount" placeholder="0"></label><label class="f">Date<input class="in-t" type="date" value="${esc(d.date)}" data-d="date"></label><label class="f full">Due date (optional)<input class="in-t" type="date" value="${esc(d.due||'')}" data-d="due"></label><label class="f full">Note<input class="in-t" value="${esc(d.note)}" data-d="note" maxlength="60" placeholder="e.g. Lunch"></label></div>
  <div class="note">This only tracks the debt. It does not change your balances until you mark it as paid.</div><button class="btn block" data-a="saveDebt">Save</button>`)};
SHEETS.debtView=()=>{const x=S.debts.find(d=>d.id===SH.id);if(!x)return '';const accs=S.accounts.filter(a=>!a.ignored);
  return wrap(x.who,`<div class="recHead ${x.theyOweMe?'income':'expense'}"><div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.9">${x.theyOweMe?'Owes you':'You owe'}</div><div class="big num" style="color:#fff">${money(x.amount)}</div><div style="font-size:12px;opacity:.9">${esc(fdate(x.date,{month:'short',day:'numeric',year:'numeric'}))}</div></div>
  ${x.due?`<div class="kv" style="border-top:0"><span>Due</span><span>${esc(fdate(x.due,{month:'short',day:'numeric',year:'numeric'}))}</span></div>`:''}${x.note?`<div class="kv" style="border-top:0"><span>Note</span><span>${esc(x.note)}</span></div>`:''}
  ${x.paid?`<div class="note">This debt is settled.</div>`:`<label class="f">${x.theyOweMe?'Money goes into':'Money comes out of'}<select class="in-t" id="debtAcct">${accs.map(a=>`<option value="${a.id}">${esc(a.icon+' '+a.name)}</option>`).join('')}</select></label><button class="btn block" data-a="debtPaid" data-id="${x.id}">Mark as paid</button>`}

SHEETS.split=()=>{const d=SH.d,tot=num(d.total),n=Math.max(2,Math.round(num(d.people))||2),share=tot>0?tot/n:0;

document.addEventListener('input',e=>{if((e.target.id==='spT'||e.target.id==='spP')&&SH&&SH.kind==='split'){const tot=num(SH.d.total),n=Math.max(2,Math.round(num(SH.d.people))||2);const el=$('#spShare');if(el)el.textContent=money(tot>0?tot/n:0)}});

  debtAdd:()=>openSheet({kind:'debtEdit',d:{who:'',amount:'',theyOweMe:true,date:todayStr(),due:'',note:''}}),

  saveDebt:()=>{const d=SH.d,a=num(d.amount);if(!d.who.trim())return toast('Who is it?');if(!(a>0))return toast('Enter an amount');S.debts.push({id:uid(),who:d.who.trim(),amount:a,theyOweMe:d.theyOweMe,date:d.date||todayStr(),due:d.due||'',note:d.note.trim(),paid:false});save();closeSheet();render();toast('Debt saved')},
  debtView:d=>openSheet({kind:'debtView',id:d.id}),
  debtPaid:d=>{const x=S.debts.find(v=>v.id===d.id),ac=($('#debtAcct')||{}).value;if(!x||!acc(ac))return toast('Choose an account');
    x.paid=true;S.recs.push({id:uid(),ts:Date.now(),type:x.theyOweMe?'income':'expense',acct:ac,to:'',cat:x.theyOweMe?'i_Other':'e_Other',amount:x.amount,date:todayStr(),note:x.theyOweMe?`${x.who} paid back`:`Paid back ${x.who}`});save();closeSheet();render();toast('Marked as paid')},
  debtDel:d=>ask('Delete this debt?','Delete',()=>{S.debts=S.debts.filter(v=>v.id!==d.id);save();closeSheet();render()}),
  splitOpen:()=>openSheet({kind:'split',d:{total:'',people:'2',names:'',acct:(S.accounts.find(a=>!a.ignored)||{}).id,paidBy:'me'}}),
  splitBy:d=>{SH.d.paidBy=d.k;renderSheet()},
  splitSave:()=>{const d=SH.d,tot=num(d.total),n=Math.max(2,Math.round(num(d.people))||2);if(!(tot>0))return toast('Enter the total bill');
    const share=Math.round(tot/n*100)/100,names=d.names.split(',').map(s=>s.trim()).filter(Boolean);
    const rec=amt=>S.recs.push({id:uid(),ts:Date.now(),type:'expense',acct:d.acct,to:'',cat:'e_Food',amount:amt,date:todayStr(),note:'Split bill'});
    if(d.paidBy==='me'){rec(tot);for(let i=0;i<n-1;i++)S.debts.push({id:uid(),who:names[i]||`Friend ${i+1}`,amount:share,theyOweMe:true,date:todayStr(),note:'Split bill',paid:false})}
    else{rec(share);S.debts.push({id:uid(),who:names[0]||'Friend',amount:share,theyOweMe:false,date:todayStr(),note:'Split bill',paid:false})}
    N.month=todayStr().slice(0,7);save();closeSheet();render();toast('Bill split')}
});

/* ---------- Bills calendar ---------- */
function vBills(){
  const T=TD(),dt=new Date(T*864e5),y=dt.getUTCFullYear(),m=dt.getUTCMonth(),first=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const dueDays={};S.bills.forEach(b=>{const dd=Math.min(b.day,dim);dueDays[dd]=(dueDays[dd]||0)+1});
  let cells=['S','M','T','W','T','F','S'].map(s=>`<b class="dow">${s}</b>`).join('');
  for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=dim;d++)cells+=`<span class="cd ${d===+todayStr().slice(8)?'today':''}">${d}${dueDays[d]?'<i></i>':''}</span>`;
  const list=S.bills.map(b=>({b,due:billDue(b,T)})).sort((a,b)=>a.due.dn-b.due.dn);
  return backHead('Bills calendar')+`<div class="stack"><button class="btn" data-a="billAdd">${ic('plus')} New bill</button>
  <div class="card"><div class="lbl" style="margin-bottom:8px">${esc(monthName(todayStr().slice(0,7)))}</div><div class="cal">${cells}</div></div>
  ${list.length?`<div class="list">${list.map(({b,due})=>`<div class="row" style="cursor:default"><span class="ico">${itemIcon(b.name)}</span><button class="rmain" style="text-align:left" data-a="billEdit" data-id="${b.id}"><b>${esc(b.name)}</b><small class="${due.dn<T?'late':''}">${esc(dueText(due.dn))} · every ${b.day}${['th','st','nd','rd'][(b.day%100>10&&b.day%100<14)?0:Math.min(b.day%10,4)%4]||'th'}</small></button><span class="amt out">${hid(b.amount)}</span><button class="btn sm" data-a="billPay" data-id="${b.id}">Pay</button></div>`).join('')}</div>`:`<div class="empty card"><div class="ico">📅</div>No bills yet.<br>Add rent, load or subscriptions to get reminders.</div>`}</div>`;
}
MORE.bills=vBills;
SHEETS.billEdit=()=>{const d=SH.d;return wrap(SH.edit?'Edit bill':'New bill',`<div class="formgrid"><label class="f full">Name<input class="in-t" value="${esc(d.name)}" data-d="name" maxlength="30" placeholder="e.g. Boarding house"></label><label class="f">Amount<input class="in-t num" inputmode="decimal" value="${esc(d.amount)}" data-d="amount" placeholder="0"></label><label class="f">Due day each month<select class="in-t" data-d="day">${Array.from({length:31},(_,i)=>`<option ${+d.day===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>

  billEdit:d=>{const b=S.bills.find(x=>x.id===d.id);openSheet({kind:'billEdit',edit:b.id,d:{name:b.name,amount:String(b.amount),day:String(b.day),acct:b.acct,cat:b.cat}})},

  billDel:()=>ask('Delete this bill?','Delete',()=>{S.bills=S.bills.filter(b=>b.id!==SH.edit);save();closeSheet();render()}),
  billPay:d=>{const b=S.bills.find(x=>x.id===d.id),due=billDue(b,TD());if(!acc(b.acct))return toast('Pick a pay-from account first');

/* ---------- Savings challenge ---------- */
function vChallenge(){
  const c=S.challenge;
  if(!c)return backHead('Savings challenge')+`<div class="stack"><div class="card stack"><div class="ico" style="font-size:34px">🪙</div><b>Save a little more each week</b><div class="sub">Week 1 you save a small amount. Each week you save a bit more. Tick each week off as you go. It is a fun way to build a habit.</div></div>
  <div class="card stack"><label class="f">First week amount<input class="in-t num" id="chBase" inputmode="decimal" value="10"></label><div class="seg"><button aria-pressed="true" data-a="chWeeks" data-k="52" id="chW52">52 weeks</button><button aria-pressed="false" data-a="chWeeks" data-k="26" id="chW26">26 weeks</button></div><button class="btn" data-a="chStart">Start challenge</button></div></div>`;
  const done=new Set(c.done),total=c.base*c.weeks*(c.weeks+1)/2,saved=sum([...done].map(w=>c.base*w));
  const cur=Math.min(c.weeks,Math.max(1,Math.floor((TD()-dn(c.start))/7)+1));
  return backHead('Savings challenge')+`<div class="stack"><div class="card" style="display:flex;gap:16px;align-items:center">${ring(total>0?saved/total:0,86,10,'var(--accent)',`<span class="gp num">${Math.round(total>0?saved/total*100:0)}%</span>`)}<div><div class="lbl">Saved so far</div><div class="mid num">${hid(saved)}</div><div class="sub">of ${hid(total)} · Week ${cur} of ${c.weeks}</div></div></div>
  <div class="card sub">This week: save <b>${hid(c.base*cur)}</b>${done.has(cur)?' ✔ done':''}</div>
  <div class="tiles">${Array.from({length:c.weeks},(_,i)=>i+1).map(w=>`<button class="tile ${done.has(w)?'on':''} ${w===cur?'cur':''}" data-a="chTick" data-w="${w}" aria-pressed="${done.has(w)}"><small>Wk ${w}</small><b class="num">${S.settings.hide?'••':money(c.base*w,{dec:0})}</b></button>`).join('')}</div>
  <button class="btn ghost block" data-a="chReset">Stop challenge</button></div>`;
}
MORE.challenge=vChallenge;
Object.assign(A,{
  chWeeks:d=>{$('#chW52').setAttribute('aria-pressed',String(d.k==='52'));$('#chW26').setAttribute('aria-pressed',String(d.k==='26'))},
  chStart:()=>{const b=num($('#chBase').value);if(!(b>0))return toast('Enter the first week amount');S.challenge={name:'Challenge',base:b,weeks:$('#chW26').getAttribute('aria-pressed')==='true'?26:52,start:todayStr(),done:[]};save();render()},
  chTick:d=>{const c=S.challenge,w=+d.w,i=c.done.indexOf(w);if(i>=0)c.done.splice(i,1);else{c.done.push(w);haptic(15)}save();render();if(c.done.length===c.weeks){confetti();toast('Challenge complete!')}},
  chReset:()=>ask('Stop the challenge and clear your ticks?','Stop',()=>{S.challenge=null;save();render()})
});

/* ---------- App lock ---------- */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ipon:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'ipon:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}
const keypad=act=>`<div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-a="${act}" data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('')}</div>`;
const dots=n=>`<div class="pdots" aria-label="${n} of 4 digits">${[0,1,2,3].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
let LK={buf:'',view:'pad'};
const bioStatus=()=>!AND?'web':(AND.biometricStatus?AND.biometricStatus():(AND.biometricAvailable&&AND.biometricAvailable()?'ok':'old'));
const bioCanTry=bs=>bs==='ok'||String(bs).startsWith('unavailable');
const BIOMSG={ok:'Unlock with your fingerprint instead of typing the code.',none_enrolled:'No fingerprint is saved on this phone yet. Add one in your phone Settings > Security, then come back.',no_hardware:'This phone has no fingerprint sensor.',unavailable:'Tap the switch to test your fingerprint.',web:'Fingerprint only works in the Android app.',old:'Your Android files are out of date. Replace MainActivity.kt with the newest one to turn this on.'};
function showLock(){
  if(!S.settings.lock||!S.settings.passHash)return;let el=$('#lock');if(!el){el=document.createElement('div');el.id='lock';document.body.appendChild(el)}
  LK.buf='';LK.view='pad';el.innerHTML=lockHtml();document.documentElement.classList.add('locked');
  if(S.settings.bio&&AND&&AND.biometric)setTimeout(()=>{if($('#lock')&&LK.view==='pad')AND.biometric()},350);
}
const lockHtml=(msg)=>{
  if(LK.view==='forgot')return `<div class="lockin"><div class="lockpig">${piggy('worried')}</div><h2>Forgot your passcode?</h2>
   <div class="sub">${AND&&AND.deviceAuth?'You can prove it is you with your phone’s own screen lock, then choose a new passcode. Your records stay safe.':'Without the phone app there is no way to check it is you.'}</div>
   ${AND&&AND.deviceAuth?'<button class="btn block" data-a="lkDevice">🔓 Use my phone screen lock</button>':''}
   <button class="btn danger block" data-a="lkErase1">🗑️ Erase everything and start over</button>
   <button class="btn ghost block" data-a="lkBack">Back</button></div>`;
  if(LK.view==='erase')return `<div class="lockin"><div class="lockpig">${piggy('worried')}</div><h2>Erase everything?</h2><div class="sub">All records, accounts, goals and budgets on this device will be deleted. This cannot be undone. A backup file would let you bring it back.</div>
   <button class="btn danger block" data-a="lkErase2">Yes, erase everything</button><button class="btn ghost block" data-a="lkBack">No, go back</button></div>`;
  return `<div class="lockin"><div class="lockpig">${piggy('happy')}</div><h2>Enter passcode</h2><div class="sub" id="lkMsg">${msg||'&nbsp;'}</div>${dots(LK.buf.length)}${keypad('lk')}<div class="lkrow">${S.settings.bio&&AND?'<button class="btn ghost sm" data-a="lkBio">👆 Fingerprint</button>':''}<button class="btn ghost sm" data-a="lkForgot">Forgot passcode?</button></div></div>`;
};
function unlock(){const el=$('#lock');if(el)el.remove();document.documentElement.classList.remove('locked');LK.buf='';LK.view='pad'}
window.__bio=(ok,msg)=>{
  if(window.__bioTest){window.__bioTest=false;if(ok){S.settings.bio=true;save();render();toast('Fingerprint is on')}else toast('Fingerprint did not work'+(msg?': '+msg:''));return}
  if(ok)unlock();else{const m=$('#lkMsg');if(m)m.textContent='Fingerprint not recognised. Use your passcode.'}};
window.__devAuth=(ok,msg)=>{
  if(!ok){const m=$('#lock .sub');if(m)m.textContent=msg==='no_lock'?'This phone has no screen lock set. Set one in your phone Settings, or erase the app data.':'That did not work. Try again.';return}
  unlock();openSheet({kind:'pass',d:{mode:'set',step:1,buf:'',first:'',msg:'Choose a new 4-digit passcode'}});
};
Object.assign(A,{
  lk:async d=>{if(d.k==='⌫')LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<4)LK.buf+=d.k;
    const el=$('#lock');if(!el)return;if(LK.buf.length===4){const h=await sha(LK.buf);if(h===S.settings.passHash){unlock();haptic(12);return}
      LK.buf='';el.innerHTML=lockHtml('Wrong passcode. Try again.');el.querySelector('.lockin').classList.add('shake');haptic(40);return}
    el.innerHTML=lockHtml()},
  lkBio:()=>{if(AND&&AND.biometric)AND.biometric()},
  lkForgot:()=>{LK.view='forgot';$('#lock').innerHTML=lockHtml()},lkBack:()=>{LK.view='pad';LK.buf='';$('#lock').innerHTML=lockHtml()},
  lkDevice:()=>{if(AND&&AND.deviceAuth)AND.deviceAuth()},

function runRecurring(){
  if(!S.recurring||!S.recurring.length)return 0;

function alertsFor(r){
  const out=[];if(S.settings.alerts===false||r.type!=='expense')return out;
  const mon=r.date.slice(0,7);
  if(r.cat){const lim=(S.budgets[mon]||{})[r.cat];if(lim>0){const sp=spentIn(mon,r.cat),before=sp-Rt(r);
    if(sp>lim&&before<=lim)out.push(`Over your ${catName(r.cat)} budget.`);else if(sp>=lim*.8&&before<lim*.8)out.push(`80% of your ${catName(r.cat)} budget used.`)}}
  if(r.date===todayStr()&&S.recs.filter(x=>x.type==='expense').length>=10){
    const T=TD(),day=sum(S.recs.filter(x=>x.type==='expense'&&x.date===r.date).map(Rt));
    const past=sum(S.recs.filter(x=>x.type==='expense'&&dn(x.date)>=T-30&&dn(x.date)<T).map(Rt))/30;
    if(past>0&&day>=3*past&&day-Rt(r)<3*past)out.push('Much more than your usual day.')}
  return out;
}

/* ---------- receipt reading (Android only: the phone reads the text) ---------- */
const amountsIn=l=>{const out=[],re=/(\d{1,3}(?:[,\s]\d{3})+|\d+)[.,](\d{2})(?!\d)/g;let m;while((m=re.exec(l))){const v=parseFloat(m[1].replace(/[,\s]/g,'')+'.'+m[2]);if(v>0&&v<1e7)out.push(v)}return out};
function parseReceipt(text){
  const lines=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let amount=0;
  const totalRe=/(grand\s*)?total|amount\s*due|balance\s*due|total\s*due|amt\s*due|to\s*pay|net\s*amount/i,skip=/sub\s*-?\s*total|change|cash|tender|vat|tax|discount|points/i;
  lines.forEach((l,i)=>{if(totalRe.test(l)&&!/sub\s*-?\s*total/i.test(l)){let a=amountsIn(l);if(!a.length&&!skip.test(lines[i+1]||''))a=amountsIn(lines[i+1]||'');if(a.length)amount=Math.max(amount,...a)}});
  if(!amount){const all=[];lines.forEach(l=>{if(!skip.test(l))amountsIn(l).forEach(v=>all.push(v))});if(all.length)amount=Math.max(...all)}
  const merchant=(lines.slice(0,6).find(l=>(l.match(/[A-Za-z]/g)||[]).length>=3&&!/receipt|invoice|tel|phone|vat|tin\b|www|\.com|official/i.test(l))||'').replace(/[^\w &'.\-]/g,'').trim().slice(0,30);
  let date='';const t=new Date(),ok=(y,m,d)=>{const x=Date.UTC(y,m-1,d)/864e5;return m>=1&&m<=12&&d>=1&&d<=31&&x<=TD()&&x>=TD()-800?`${y}-${pad(m)}-${pad(d)}`:''};
  const j=text.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(j)date=ok(+j[1],+j[2],+j[3]);else{const k=text.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(k){let a=+k[1],b=+k[2],y=+k[3];if(y<100)y+=2000;date=a>12?ok(y,b,a):ok(y,a,b)}}
  return {amount,merchant,date};
}

/* ---------- calculator in the Amount field ---------- */
function calc(src){
  let s=String(src==null?'':src).replace(/[,\s ₱$€£¥]/g,'').replace(/(\d)[xX](?=[\d(.])/g,'$1*').replace(/[×*]/g,'*').replace(/[÷]/g,'/').replace(/[−–—]/g,'-');
  if(!s)return NaN;let i=0;
  const peek=()=>s[i];
  function number(){const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  function atom(){if(peek()==='('){i++;const v=expr().v;if(peek()!==')')throw 0;i++;return v}return number()}
  function factor(){let sg=1;while(peek()==='-'||peek()==='+'){if(peek()==='-')sg=-sg;i++}let v=atom(),pct=false;while(peek()==='%'){i++;v/=100;pct=true}return {v:sg*v,pct}}
  function term(){let a=factor();let single=true;while(peek()==='*'||peek()==='/'){const o=s[i++],b=factor();single=false;a={v:o==='*'?a.v*b.v:a.v/b.v,pct:false}}return {v:a.v,pct:single&&a.pct}}
  function expr(){let a=term().v;let t;while(peek()==='+'||peek()==='-'){const o=s[i++];t=term();const r=t.pct?a*t.v:t.v;a=o==='+'?a+r:a-r}return {v:a}}
  try{const v=expr().v;if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}
}
const hasOp=v=>/[+*\/×÷%()−-]/.test(String(v||'').replace(/^[-−+]/,''))||/\d[xX]\d/.test(String(v||''));
function calcHint(v){if(!hasOp(v))return '';const r=calc(v);return isNaN(r)?'':'= '+r.toLocaleString('en-US',{maximumFractionDigits:2})}
(function(){

  A.calcOp=d=>{const i=$('#amt');if(!i)return;const s=i.selectionStart==null?i.value.length:i.selectionStart,e=i.selectionEnd==null?s:i.selectionEnd,op=d.k==='*'?'×':d.k==='/'?'÷':d.k==='-'?'−':'+';

  A.calcEq=()=>{const i=$('#amt');if(!i)return;const r=calc(i.value);if(isNaN(r))return toast('Check the calculation');setVal(i,String(r));i.focus()};

const CSVI={text:'',rows:[],head:[],map:{},ord:'mdy',posIs:'expense',acct:'',name:''};
function parseCSV(t){
  t=String(t||'').replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/,1)[0]||'',cnt=c=>first.split(c).length-1;
  const delim=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function csvAutoMap(head){
  const used=new Set(),h=head.map(x=>String(x).toLowerCase().trim()),map={};
  const find=(key,tests)=>{for(const re of tests){const i=h.findIndex((x,ix)=>!used.has(ix)&&re.test(x));if(i>=0){used.add(i);map[key]=i;return}}};
  find('date',[/^date$/,/date/,/^day$/,/when|time/]);
  find('amount',[/^amount$/,/^(value|sum|total|price|cost)$/,/amount|value|debit|credit/]);
  find('type',[/^type$/,/^(kind|direction|flow|in\/out)$/,/type/]);
  find('to',[/to account|destination|^to$/]);
  find('acct',[/^account$/,/wallet|source|from account|bank/,/account/]);
  find('cat',[/^category$/,/categ|group|tag/]);
  find('note',[/^note/,/memo|desc|detail|payee|merchant|title|remark|^name$/]);
  return map;
}
const csvMk=(y,m,d)=>(m<1||m>12||d<1||d>31)?null:y+'-'+pad(m)+'-'+pad(d);
function csvDate(s,ord){
  s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return csvMk(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;return ord==='dmy'?csvMk(y,b,a):csvMk(y,a,b)}
  const d=new Date(s);return isNaN(d)?null:csvMk(d.getFullYear(),d.getMonth()+1,d.getDate());
}
function csvAmt(s){
  s=String(s==null?'':s).trim();if(!s)return NaN;
  let neg=/^\(.*\)$/.test(s)||/^[-\u2212]/.test(s.replace(/^[^\d\-\u2212(]+/,''))||/[-\u2212]\s*$/.test(s);
  s=s.replace(/[^\d.,]/g,'');if(!s)return NaN;
  if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.includes(',')){s=/,\d{1,2}$/.test(s)&&(s.match(/,/g)||[]).length===1?s.replace(',','.'):s.replace(/,/g,'')}
  const v=parseFloat(s);return isNaN(v)?NaN:(neg?-v:v);
}
function csvGuessOrder(){

function csvPlan(){
  const out={recs:[],newAcc:[],newCat:[],bad:0,dupes:0,first:null,last:null};

  const target=S.accounts.find(a=>a.id===CSVI.acct)||S.accounts.find(a=>!a.ignored)||S.accounts[0];
  const getAcc=name=>{name=String(name||'').trim();if(!name)return target?target.id:'';const k=name.toLowerCase();
    if(accByName.has(k))return accByName.get(k);if(newAccMap.has(k))return newAccMap.get(k).id;
    const a={id:uid(),name,icon:'👛',kind:'cash',initial:0,openDate:'',ignored:false,rate:1,cur:''};newAccMap.set(k,a);return a.id};
  const catBy=new Map(S.cats.map(c=>[c.type+'|'+c.name.toLowerCase(),c.id])),newCatMap=new Map();
  const getCat=(name,type)=>{name=String(name||'').trim();if(!name)return '';const k=type+'|'+name.toLowerCase();
    if(catBy.has(k))return catBy.get(k);if(newCatMap.has(k))return newCatMap.get(k).id;
    const c={id:(type==='income'?'i_':'e_')+name,name,icon:itemIcon(name,'🏷️'),type,ignored:false};newCatMap.set(k,c);return c.id};
  const seen=new Set(S.recs.map(r=>[r.date,r.type,r.acct,r.amount,r.note||''].join('|')));
  rows.forEach(r=>{
    const date=csvDate(r[M.date],CSVI.ord),raw=csvAmt(r[M.amount]);

    const amount=Math.abs(raw);let type;
    const tv=M.type!=null?String(r[M.type]||'').toLowerCase():'';

    else if(/income|credit|deposit|received|salary|^in$|\+/.test(tv))type='income';
    else if(/expense|debit|withdraw|spent|purchase|payment|^out$/.test(tv))type='expense';
    else type=raw<0?'expense':CSVI.posIs;
    const note=M.note!=null?String(r[M.note]||'').trim().slice(0,120):'';
    const acct=getAcc(M.acct!=null?r[M.acct]:'');let to='';
    if(type==='transfer'){to=M.to!=null?getAcc(r[M.to]):'';if(!to||to===acct){type=raw<0?'expense':CSVI.posIs;to=''}}
    const catId=(type==='income'||type==='expense')&&M.cat!=null?getCat(r[M.cat],type):'';
    const key=[date,type,acct,amount,note].join('|');
    if(seen.has(key)){out.dupes++;return}
    out.recs.push({type,acct,to,cat:catId,amount,date,note});
    if(!out.first||date<out.first)out.first=date;if(!out.last||date>out.last)out.last=date;
  });
  out.newAcc=[...newAccMap.values()];out.newCat=[...newCatMap.values()];return out;
}
function csvLoad(text){

/* ---------- smarter categories: learn from the words you use ---------- */
function learnCat(n,type,ok){
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>=3);if(!words.length)return null;
  const tally={};
  S.recs.slice(-800).forEach(r=>{if(r.type!==type||!ok.includes(r.cat))return;const rw=(r.note||'').toLowerCase().split(/[^a-z0-9]+/);
    words.forEach(w=>{if(rw.includes(w)){const t=tally[w]||(tally[w]={});t[r.cat]=(t[r.cat]||0)+1}})});
  let best=null,bs=0;
  Object.values(tally).forEach(t=>{const tot=sum(Object.values(t)),[c,k]=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
    if(tot>=2&&k/tot>=.7&&k>bs){best=c;bs=k}});
  return best;
}

function feeStats(a){
  const cfg=a.bank,fee=Number(cfg.fee)||0;if(!(fee>0))return null;
  const c0=bankCalc(a),st=c0.ser.start;if(st==null)return null;
  let end=c0.p.start-1,n=0;const res=[];
  while(n<36){const p=period(cfg,end);if(p.start<=st)break;const c=bankCalc(a,p.end);res.push(c.verdict==='ok'||c.verdict==='locked');end=p.start-1;n++}
  if(!res.length)return null;
  const ok=res.filter(Boolean).length;let run=0;while(run<res.length&&res[run])run++;
  return {ok,bad:res.length-ok,n:res.length,run,saved:ok*fee};
}
