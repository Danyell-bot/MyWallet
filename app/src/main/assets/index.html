/* ---------- streak freeze + levels ---------- */
const wkOf=d=>Math.floor((d+3)/7);
function streakInfo(){
  const ds=loggedDays(),T=TD();let d=ds.has(T)?T:T-1,c=0,guard=0;const used=new Set();
  while(guard++<4000){
    if(ds.has(d)){c++;d--;continue}
    if(ds.has(d-1)&&!used.has(wkOf(d))){used.add(wkOf(d));d--;continue}
    break;
  }
  return {count:c,freezeUsed:used.has(wkOf(T))||used.has(wkOf(T-1))&&wkOf(T-1)===wkOf(T)};
}
function streak(){return streakInfo().count}
const LEVELS=[[0,'Beginner'],[10,'Tracker'],[40,'Saver'],[100,'Budgeter'],[250,'Money pro'],[600,'Wallet wizard'],[1500,'Legend']];
function levelInfo(){
  const xp=S.recs.filter(r=>r.type!=='check').length;let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});
  const cur=LEVELS[i],nx=LEVELS[i+1];
  return {i,xp,name:cur[1],next:nx?nx[1]:null,need:nx?nx[0]-xp:0,pct:nx?Math.round((xp-cur[0])/(nx[0]-cur[0])*100):100};
}
function vBadges2(){
  const L=levelInfo(),sf=streakInfo();
  const card=`<div class="card stack" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Level ${L.i+1} · ${esc(L.name)}</b><span class="sub">${L.xp} records</span></div><div class="bar"><i style="width:${L.pct}%"></i></div>
  <div class="sub">${L.next?`${L.need} more record${L.need===1?'':'s'} to reach ${esc(L.next)}.`:'Top level. Nicely done!'}</div>
  <div class="sub">🧊 Streak freeze: ${sf.freezeUsed?'used this week':'ready'}. Once a week, one missed day will not break your streak.</div></div>`;
  return vBadges().replace('<div class="stack">','<div class="stack">'+card);
}
MORE.badges=vBadges2;

/* ---------- year in review ---------- */
N.wy=null;
const wyYear=()=>N.wy||+todayStr().slice(0,4);
function wrappedData(y){
  const rs=S.recs.filter(r=>r.type==='expense'&&r.date.slice(0,4)===String(y)),inc=sum(S.recs.filter(r=>r.type==='income'&&r.date.slice(0,4)===String(y)).map(Rt)),ex=sum(rs.map(Rt));
  const by={};rs.forEach(r=>{by[r.cat]=(by[r.cat]||0)+Rt(r)});const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const big=[...rs].sort((a,b)=>Rt(b)-Rt(a))[0];
  const bm={};rs.forEach(r=>{const m=r.date.slice(0,7);bm[m]=(bm[m]||0)+Rt(r)});const bus=Object.entries(bm).sort((a,b)=>b[1]-a[1])[0];
  const n=S.recs.filter(r=>r.type!=='check'&&r.date.slice(0,4)===String(y)).length;
  return {y,ex,inc,top,big,bus,n,best:longestStreak()};
}
function wrappedCards(w){
  const card=(c,h,b,s)=>`<div class="rc rc${c}"><small>${h}</small><div class="rbig num">${b}</div><div class="rsub">${s}</div></div>`;
  return [
    card(0,`Your ${w.y}`,hid(w.ex),'spent in total'),
    card(1,'Money in',hid(w.inc),w.inc>=w.ex?`You kept ${hid(w.inc-w.ex)} of it.`:`${hid(w.ex-w.inc)} more went out than came in.`),
    w.top?card(2,'Top category',`${esc((cat(w.top[0])||{icon:'•'}).icon)} ${esc(catName(w.top[0]))}`,`${hid(w.top[1])} (${Math.round(w.top[1]/w.ex*100)}%)`):card(2,'Top category','—','No expenses yet'),
    w.big?card(3,'Biggest expense',hid(Rt(w.big)),esc(recTitle(w.big))+' on '+esc(fdate(w.big.date))):card(3,'Biggest expense','—','Nothing yet'),
    w.bus?card(4,'Busiest month',esc(monthName(w.bus[0]).split(' ')[0]),`${hid(w.bus[1])} spent`):card(4,'Busiest month','—','No data'),
    card(5,'Records logged',String(w.n),`Best streak: ${w.best} day${w.best===1?'':'s'}`)
  ];
}
function vWrapped(){
  const y=wyYear(),w=wrappedData(y);
  return backHead('Year in review')+`<div class="stack"><div class="mnav"><button class="iconbtn" data-a="wyear" data-k="-1" aria-label="Previous year">${ic('left')}</button><b>${y}</b><button class="iconbtn" data-a="wyear" data-k="1" aria-label="Next year">${ic('right')}</button></div>
  <div class="rcrow" tabindex="0" aria-label="Year cards, swipe sideways">${wrappedCards(w).join('')}</div><div class="sub" style="text-align:center">Swipe sideways to see more</div><button class="btn" data-a="wrappedImg">Share as picture</button></div>`;
}
MORE.wrapped=vWrapped;
A.wyear=d=>{N.wy=wyYear()+(+d.k);render()};
A.wrappedImg=()=>{try{
  const w=wrappedData(wyYear()),c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,1080,1350);gr.addColorStop(0,'#0A3B4A');gr.addColorStop(1,'#17A580');g.fillStyle=gr;g.fillRect(0,0,1080,1350);
  g.fillStyle='#fff';g.font='700 40px system-ui,sans-serif';g.fillText('MYWALLET',80,110);
  g.font='800 120px system-ui,sans-serif';g.fillText('My '+w.y,80,260);g.font='600 44px system-ui,sans-serif';g.globalAlpha=.85;g.fillText('in money',80,320);g.globalAlpha=1;
  const rows=[['Spent',money(w.ex)],['Money in',money(w.inc)],['Top category',w.top?catName(w.top[0]):'—'],['Biggest expense',w.big?money(Rt(w.big)):'—'],['Busiest month',w.bus?monthName(w.bus[0]).split(' ')[0]:'—'],['Records logged',String(w.n)],['Best streak',w.best+' days']];
  rows.forEach((r,i)=>{const y=470+i*110;g.globalAlpha=.7;g.font='600 36px system-ui,sans-serif';g.fillText(r[0],80,y);g.globalAlpha=1;g.font='800 52px system-ui,sans-serif';g.textAlign='right';g.fillText(r[1],1000,y+4);g.textAlign='left';g.fillStyle='rgba(255,255,255,.2)';g.fillRect(80,y+30,920,2);g.fillStyle='#fff'});
  openSheet({kind:'report',url:c.toDataURL('image/png'),name:'mywallet-'+w.y+'.png'});
}catch(e){toast('Could not make the picture')}};

/* ---------- PDF statement (prints the month as a clean page) ---------- */
function statementHtml(m){
  const rs=S.recs.filter(r=>r.type!=='check'&&inMonth(r,m)).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const ex=monthSum(m,'expense'),inc=monthSum(m,'income');
  const row=r=>{const a=acc(r.acct),col=r.type==='income'?'#12805C':r.type==='expense'?'#D1453B':'#444';const sg=r.type==='income'?'+':r.type==='expense'?'-':'';
    return `<tr><td>${esc(fdate(r.date,{month:'short',day:'numeric'}))}</td><td>${esc(recTitle(r))}${r.note?`<br><small>${esc(r.note)}</small>`:''}</td><td>${esc(a?a.name:'')}</td><td style="text-align:right;color:${col};white-space:nowrap">${sg}${esc(moneyA(r.amount,a))}</td></tr>`};
  return `<!doctype html><html><head><meta charset="utf-8"><title>MyWallet ${esc(monthName(m))}</title><style>body{font:13px system-ui,sans-serif;color:#111;margin:24px}h1{font-size:22px;margin:0}p{color:#555;margin:2px 0 14px}.s{display:flex;gap:24px;margin:10px 0 18px}.s div{flex:1;border:1px solid #ddd;border-radius:10px;padding:10px}.s b{display:block;font-size:17px}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;color:#777;border-bottom:2px solid #ccc;padding:6px 4px}td{border-bottom:1px solid #eee;padding:7px 4px;vertical-align:top}small{color:#777}</style></head><body><h1>MyWallet statement</h1><p>${esc(monthName(m))}</p>
  <div class="s"><div>Money in<b style="color:#12805C">${esc(money(inc))}</b></div><div>Spent<b style="color:#D1453B">${esc(money(ex))}</b></div><div>Net<b>${esc(money(inc-ex,{sign:true}))}</b></div></div>
  <table><thead><tr><th>Date</th><th>Details</th><th>Account</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rs.map(row).join('')||'<tr><td colspan="4">No records this month.</td></tr>'}</tbody></table></body></html>`;
}
A.pdfStatement=()=>{const m=N.month,html=statementHtml(m),title='MyWallet-'+m;
  if(AND&&AND.printHtml){try{AND.printHtml(html,title);return}catch(e){}}
  try{const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;opacity:0';document.body.appendChild(f);f.srcdoc=html;
    f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Printing is not available here')}setTimeout(()=>f.remove(),60000)}}catch(e){toast('Printing is not available here')}};

function brandOf(a){
  if(!a)return null;
  const n=String(a.name||'').toLowerCase();if(!n)return null;
  for(const b of BRANDS)if(b[0].test(n))return {g:b[1],lt:!!b[2]};
  return null;
}
const brandCls=a=>{const b=brandOf(a);return b?' brand'+(b.lt?' lt':''):''};

/* ---------- streak flames grow with your streak ---------- */
function flames(n,max,cls){
  const t=n>=30?5:n>=14?4:n>=7?3:n>=3?2:1,k=Math.min(t,max||3);
  return Array.from({length:k},()=>`<span class="flame ${cls||''}">🔥</span>`).join('')+(n>=100&&max>3?'<span class="flame">👑</span>':'');
}
(function(){const _vb=vBadges2;vBadges2=function(){return _vb().replace('<span class="flame big3">🔥</span>',`<span class="flms">${flames(streak(),5,'f5')}${streak()>=100?'<span>👑</span>':''}</span>`)};MORE.badges=vBadges2})();

boot();
